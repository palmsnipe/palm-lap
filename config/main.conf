[General]

# Advertise this dedicated gateway as a classic LAN/Network Access Point.
# BlueZ considers only major/minor bits here; palm-lap-compat and
# palm-lap-pair add the Networking service-class hint for withdrawn LAP UUID
# 0x1102 through the management API.
Class = 0x000300

# Use a deliberate ten-minute setup window and no
# pairing without an agent. palm-lap-pair controls both flags explicitly.
DiscoverableTimeout = 600
AlwaysPairable = false
PairableTimeout = 600

